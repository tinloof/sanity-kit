name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/**"
      - "apps/**"
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "biome.json"
      - ".github/workflows/**"
      - ".changeset/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build all public packages
        run: pnpm run build
      - name: Generate consumer types
        run: pnpm run typegen
      - name: Check all packages, apps and examples
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
