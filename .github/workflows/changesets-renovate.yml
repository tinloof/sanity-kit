name: Generate changeset for Renovate

on:
  pull_request:
    paths:
      - ".github/workflows/changesets-renovate.yml"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "package.json"
      - "pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  generate-changeset:
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref }}
      - name: Git Identity
        run: |
          git config --global user.name 'tinloof-bot'
          git config --global user.email 'bot@tinloof.com'
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.18.0"
      - name: Run changesets-renovate
        run: pnpm dlx @scaleway/changesets-renovate@4.0.1
