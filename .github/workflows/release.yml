name: Release

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Set npm version
        run: npm install -g npm@12.0.2

      - name: Install dependencies
        run: pnpm run build-install

      - name: Build Packages
        run: pnpm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          # Note: pnpm install after versioning is necessary to refresh lockfile
          version-script: pnpm run ci:version
          publish-script: pnpm run ci:publish
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/github-script@v9.0.0
        if: steps.changesets.outputs.published == 'true'
        name: Parse Changeset `published-packages` output
        id: parse_packages
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        with:
          script: |
            const changes = JSON.parse(process.env.PUBLISHED_PACKAGES || "[]");
            let message = ":rocket: *New release* :rocket:\n\n\nA new release of *${{github.repository}}* was published!";
            if (Array.isArray(changes) && changes.length > 0) {
              message += "\n\n";
              changes.forEach(package => {
                message += `*Package:* \`${package.name}\`\n*Version:* \`${package.version}\`\n\n`;
              });
            }
            message += "Changelog :point_right: https://github.com/${{github.repository}}/releases";
            core.setOutput("blocks",
              JSON.stringify({
                "text": message
              })
            );

      - name: Send a Slack notification if a publish happens
        if: steps.changesets.outputs.published == 'true'
        id: slack
        uses: slackapi/slack-github-action@v4.0.0
        with:
          # This data can be any valid JSON from a previous step in the GitHub Action
          payload: ${{steps.parse_packages.outputs.blocks}}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
